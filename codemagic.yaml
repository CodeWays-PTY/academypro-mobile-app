# Codemagic CI/CD Configuration for AcademyPro iOS
workflows:
  ios-testflight:
    name: AcademyPro iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      # Links the App Store Connect API integration configured in Codemagic
      app_store_connect: Codemagic API Key
    environment:
      groups:
        - app_store_connect
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "co.usport.coachApp"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "co.usport.coachApp"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          rm -rf ios/Flutter/ephemeral/Packages
          flutter clean
          flutter pub get
      - name: Generate Flutter iOS config files
        script: |
          flutter build ios --config-only --no-codesign
      - name: Set up iOS code signing (Manual)
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          flutter build ios --release --no-codesign
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration # Uses the App Store Connect API key integration configured in Codemagic
        submit_to_testflight: false
